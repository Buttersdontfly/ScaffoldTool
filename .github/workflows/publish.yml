# The NuGet trusted publishing policy is bound to this FILE NAME.
# Renaming this file, the repository, or the owner breaks publishing until the
# policy on nuget.org is updated to match.

name: Publish

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without a leading v (e.g. 0.6.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # required for the OIDC token exchange

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The tag is the single source of truth for the version. The <Version> in
      # Scaffold.csproj is for local builds only and is overridden here, so the
      # two can never disagree in a published package.
      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a valid semantic version."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release -p:Version=${{ steps.version.outputs.version }}

      # Never publish a version that has not passed its own tests.
      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

      - name: Pack
        run: >
          dotnet pack Scaffold/Scaffold.csproj
          --no-build -c Release
          -p:Version=${{ steps.version.outputs.version }}
          -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg-${{ steps.version.outputs.version }}
          path: artifacts/*

      # The temporary key is valid for about an hour, so this sits immediately
      # before the push rather than at the top of the job.
      - name: NuGet login (OIDC to short-lived key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
