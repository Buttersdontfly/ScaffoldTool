name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # Integration tests build Scaffold.TestModel through the probe, so this
      # also proves the generated probe project still compiles.
      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

      # Catches packaging problems on every commit rather than at tag time,
      # when a broken pack means a burnt version number.
      - name: Pack (verification only)
        run: dotnet pack Scaffold/Scaffold.csproj --no-build -c Release -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg-preview
          path: artifacts/*
          retention-days: 7
